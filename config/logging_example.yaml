# config/logging.yaml
# Configuración de logging del proyecto (compatible con logging.config.dictConfig)

version: 1
disable_existing_loggers: false

formatters:
  simple:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  detailed:
    format: "%(asctime)s - %(name)s - %(levelname)s - [%(filename)s:%(lineno)d] - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout

  file_info:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: detailed
    filename: logs/pipeline.log
    maxBytes: 10485760       # 10 MB
    backupCount: 5
    encoding: utf8

  file_error:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: logs/errors.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf8

loggers:
  src.data:
    level: DEBUG
    handlers: [console, file_info]
    propagate: false

  src.features:
    level: DEBUG
    handlers: [console, file_info]
    propagate: false

  src.models:
    level: INFO
    handlers: [console, file_info, file_error]
    propagate: false

root:
  level: WARNING
  handlers: [console, file_error]