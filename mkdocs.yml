site_name: Trabajo de maestría en Ingeniería Analítica
site_author: Kevin Hidalgo

theme:
  name: dracula
  logo: img/dracula.png
  favicon: img/favicon.ico
#  name: material
#  palette:
#    # Modo claro
#    - scheme: default
#      toggle:
#        icon: material/brightness-7
#        name: Cambiar a modo oscuro
#    # Modo oscuro
#    - scheme: slate
#      toggle:
#        icon: material/brightness-4
#        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.] # Directorio donde reside tu código fuente Python
          options:
            docstring_style: google # Compatible con formato Google o NumPy
            show_root_heading: true
            show_source: true
            # show_attributes: false # <-- Oculta todas las variables y constantes
            filters:
              - "!^_[^_]"             # (Por defecto) Oculta variables privadas con un solo guion bajo
              - "!^__[a-zA-Z0-9_]+__$" # Oculta todas las variables dunder (__version__, __authors__, etc.)
  - mkdocs-jupyter

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Inicio: index.md
  - src: src.md